name: Direct MQTT runtime CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: pip install pytest-homeassistant-custom-component==0.13.373
      - run: python -m pytest -q -o asyncio_mode=auto tests/home_assistant/test_direct_mqtt.py
