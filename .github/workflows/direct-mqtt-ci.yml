name: Direct MQTT runtime CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: pip install pytest-homeassistant-custom-component==0.13.373
      - run: python -m pytest -q -o asyncio_mode=auto tests/home_assistant/test_direct_mqtt.py
