# Owner-invoked Windows build candidate — NOT an executable release/signing workflow.
# Intentionally no contents:write, signing token, SignPath submission, GitHub
# Release creation, installer execution or OTA deployment.
name: Windows unsigned candidate (SignPath preparation)
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: windows-unsigned-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    # Only a reviewed main build; issue #9 acts as a strict owner-triggered
    # fallback where no workflow-dispatch connector is available.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'mhalak/hal-gaming-control' &&
      ((github.event_name == 'workflow_dispatch' && github.actor == 'mhalak') ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.number == 9 &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login == 'mhalak' &&
        startsWith(github.event.comment.body, '/build-windows-candidate ')))
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: windows_agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Verify source identity and scripts
        run: |
          py -3.12 ../tools/release_identity.py check
          if ($LASTEXITCODE) { throw 'Inconsistent release identity' }
          ./check_powershell.ps1 .
          if ($LASTEXITCODE) { throw 'Unreviewed installer scripts' }
          if (git status --porcelain --untracked-files=all) {
            throw 'Dirty source checkout'
          }
      - name: Verify exact owner command matches declared Windows version
        env:
          RELEASE_COMMAND: ${{ github.event.comment.body }}
        run: |
          $version = (Get-Content ../release.json -Raw | ConvertFrom-Json).windows_agent
          if ($env:GITHUB_EVENT_NAME -eq 'issue_comment' -and
              $env:RELEASE_COMMAND -cne "/build-windows-candidate $version") {
            throw 'Owner command does not match reviewed Windows source version'
          }
      - name: Verify full Windows wheelhouse against reviewed SHA-256 lock
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/windows_agent/preview-constraints.txt
        run: |
          $wheelhouse = Join-Path $env:RUNNER_TEMP 'windows-locked-wheelhouse'
          $requirements = Join-Path $env:RUNNER_TEMP 'windows-hashed-requirements.txt'
          New-Item -ItemType Directory -Path $wheelhouse -Force | Out-Null
          & py -3.12 -m pip download --only-binary=:all: --dest $wheelhouse -r preview-audit-requirements.txt
          if ($LASTEXITCODE) { throw 'Could not download Windows locked wheel candidates' }
          & py -3.12 ../tools/windows_wheel_lock.py --root .. --wheelhouse $wheelhouse --output $requirements
          if ($LASTEXITCODE) { throw 'Windows wheel SHA-256 lock verification FAILED' }
          "HAL_WINDOWS_LOCKED_WHEELS=$wheelhouse" >> $env:GITHUB_ENV
          "HAL_WINDOWS_HASHED_REQUIREMENTS=$requirements" >> $env:GITHUB_ENV
      - name: Build unsigned candidate from exact main revision
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/windows_agent/preview-constraints.txt
        run: |
          ./build.ps1 -RequireLockedWheels
          if ($LASTEXITCODE) { throw 'Candidate build failed' }
      - name: Verify first-party version metadata and explicit unsigned status
        run: |
          $version = (Get-Content ../release.json -Raw | ConvertFrom-Json).windows_agent
          $owned = @(
            'SmartHouseGamingControl/SmartHouseGamingControl.exe',
            'SmartHouseGamingUpdater/SmartHouseGamingUpdater.exe'
          )
          foreach ($name in $owned) {
            $path = Join-Path 'dist' $name
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing owned EXE: $name"
            }
            $metadata = (Get-Item -LiteralPath $path).VersionInfo
            if ($metadata.ProductName -cne 'HAL Gaming Control' -or
                $metadata.ProductVersion -cne $version -or
                $metadata.FileVersion -cne $version) {
              throw "Missing or inconsistent owned EXE version metadata: $name"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'NotSigned') {
              throw "Unexpected signature in unsigned candidate: $name"
            }
            $digest = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            Write-Host "Unsigned candidate $name v$version SHA-256 $digest"
          }
          if ((Get-Content dist/SmartHouseGamingControl/version.txt -Raw).Trim() -cne $version) {
            throw 'Inconsistent agent version.txt'
          }
      - name: Dry-run license-complete Windows ZIP locally (NO Pages/Release upload)
        run: |
          $python = Join-Path $PWD '.venv/Scripts/python.exe'
          if (!(Test-Path -LiteralPath $python -PathType Leaf)) {
            throw 'Missing Windows build environment'
          }
          & $python ../tools/windows_preview_licenses.py --root ..
          if ($LASTEXITCODE) { throw 'Unsigned ZIP licensing stage failed' }
          $sha = (git rev-parse HEAD).Trim()
          $out = Join-Path $env:RUNNER_TEMP 'unsigned-private-preview'
          & $python ../tools/windows_download_page.py --root .. --sha $sha --output $out
          if ($LASTEXITCODE) { throw 'Unsigned ZIP packaging dry-run failed' }
          $version = (Get-Content ../release.json -Raw | ConvertFrom-Json).windows_agent
          $packageDir = Join-Path $out "windows/$version"
          $package = Get-Content (Join-Path $packageDir 'manifest.json') -Raw | ConvertFrom-Json
          $zip = Join-Path $packageDir $package.archive
          if ($package.version -cne $version -or $package.source_sha -cne $sha -or
              $package.signature_status -cne 'NotSigned' -or
              $package.trusted_for_installation -ne $false -or
              !(Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw 'Incorrect private ZIP provenance or release status'
          }
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $package.sha256) {
            throw 'Private ZIP SHA-256 does not match manifest'
          }
          & $python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); names=set(z.namelist()); required={'LICENSE','THIRD_PARTY_NOTICES.md','licenses/manifest.json','SmartHouseGamingControl/SmartHouseGamingControl.exe','SmartHouseGamingUpdater/SmartHouseGamingUpdater.exe'}; assert required<=names; assert z.testzip() is None" $zip
          if ($LASTEXITCODE) { throw 'Private ZIP incomplete or invalid' }
          Write-Host "PRIVATE UNSIGNED preview staging SUCCESS: v$version commit $sha"
          Write-Host 'This temporary ZIP is not uploaded or published and will be discarded with the runner.'
      - name: Upload short-lived unsigned CI candidate (NOT a public release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UNSIGNED-windows-candidate-${{ github.run_id }}
          path: |
            windows_agent/dist/SmartHouseGamingControl/
            windows_agent/dist/SmartHouseGamingUpdater/
            windows_agent/install.ps1
            windows_agent/install_helpers.ps1
            windows_agent/uninstall.ps1
            windows_agent/config.example.yaml
          if-no-files-found: error
          retention-days: 1
