name: Recorder coverage CI
run-name: 'CI tested commit ${{ github.sha }}'
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  # PR revisions supersede one another; main, schedules and manual runs never do.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  reuse:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/ci-reuse.yml
  coverage:
    needs: reuse
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.reuse.outputs.run_tests != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q tests/home_assistant/test_coverage.py
