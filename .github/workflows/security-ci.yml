name: Security CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install pinned open-source scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - name: Scan checked-out Git history with fully redacted findings
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --no-banner --log-opts="--all" .

  python-sast:
    name: Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install bandit==1.8.6
      - name: Report medium and high severity findings for review
        run: python -m bandit -r custom_components windows_agent -x windows_agent/tests -ll --exit-zero
      - name: Fail on high severity findings
        run: python -m bandit -r custom_components windows_agent -x windows_agent/tests -lll

  python-dependencies:
    name: pip-audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      - name: Audit resolved Windows runtime dependencies
        run: python -m pip_audit --strict -r windows_agent/requirements.txt
      - name: Audit HA integration-specific requirements
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          requirements = []
          for path in Path("custom_components").glob("*/manifest.json"):
              requirements.extend(json.loads(path.read_text(encoding="utf-8")).get("requirements", []))
          if requirements:
              path = Path("ha-audit-requirements.txt")
              path.write_text("\n".join(requirements) + "\n", encoding="utf-8")
              subprocess.run([sys.executable, "-m", "pip_audit", "--strict", "-r", str(path)], check=True)
          else:
              print("No integration-specific pip requirements; HA core dependencies are outside this scope.")
          PY

  powershell:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze production PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force -Repository PSGallery
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $files = @(Get-ChildItem -Path windows_agent -Filter '*.ps1' -File)
          if ($files.Count -eq 0) { throw 'No production PowerShell scripts found' }
          $findings = @($files | ForEach-Object {
              Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error,Warning -ErrorAction Stop
          })
          $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
          if (@($findings | Where-Object Severity -eq 'Error').Count -gt 0) {
              throw 'PSScriptAnalyzer reported errors'
          }

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          warn-only: false
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
