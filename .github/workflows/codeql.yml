name: CodeQL
run-name: 'CI tested commit ${{ github.sha }}'
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:
concurrency:
  # PR revisions supersede one another; main, schedules and manual runs never do.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:python
