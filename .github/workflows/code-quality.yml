name: Python code quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # PR revisions supersede one another; main, schedules and manual runs never do.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-quality.txt pytest
      - run: python -m pytest -q tests/test_quality_gate.py tests/test_ci_event_policy.py tests/test_repository_identity.py
      - name: Enforce function and method complexity (maximum C)
        run: |
          set -o pipefail
          python tools/quality_gate.py complexity | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: complexity-report
          path: complexity-report.json
          if-no-files-found: error
          retention-days: 14

  ha-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: |
            requirements-quality.txt
            windows_agent/requirements-dev.txt
            windows_agent/requirements.txt
      - run: uv pip install --system -r requirements-quality.txt pytest-homeassistant-custom-component==0.13.373
      - name: Measure all existing HA test suites
        run: |
          python -m coverage run --rcfile=.coveragerc-ha -m pytest -q -o asyncio_mode=auto tests/home_assistant/test_rules.py tests/home_assistant/test_liveness.py tests/home_assistant/test_update_protocol.py tests/home_assistant/test_coverage.py tests/home_assistant/test_candidate_protocol.py tests/home_assistant/test_app_registry.py tests/home_assistant/test_app_editor.py tests/home_assistant/test_foreground_accounting.py tests/home_assistant/test_raw_foreground.py tests/home_assistant/test_foreground_source.py tests/home_assistant/test_foreground_store.py tests/home_assistant/test_legacy_activity_cleanup.py tests/home_assistant/test_foreground_e2e.py tests/home_assistant/test_foreground_coordinator.py tests/home_assistant/test_foreground_sensor.py tests/home_assistant/test_budget_overview.py tests/home_assistant/test_parent_bonus_journal.py tests/home_assistant/test_parent_bonus_undo.py tests/home_assistant/test_restriction_sensor.py tests/home_assistant/test_schedule_controls.py tests/home_assistant/test_weekend_schedule.py tests/home_assistant/test_fresh_start.py tests/home_assistant/test_ota_sender.py tests/home_assistant/test_ota_transport.py tests/home_assistant/test_ota_release.py tests/home_assistant/test_ota_pipeline.py tests/home_assistant/test_ota_signed_install.py tests/home_assistant/test_screen_idle.py tests/home_assistant/test_screen_idle_ha.py tests/home_assistant/test_unified_telemetry.py tests/home_assistant/test_unified_telemetry_ha.py
          python -m coverage run --append --rcfile=.coveragerc-ha -m pytest -q -o asyncio_mode=auto tests/home_assistant/test_ha_runtime.py tests/home_assistant/test_options_flow_tracked_apps.py tests/home_assistant/test_recorder_runtime.py tests/home_assistant/test_automation_owned_cleanup.py
          python -m coverage run --append --rcfile=.coveragerc-ha -m pytest -q -o asyncio_mode=auto tests/home_assistant/test_direct_mqtt.py tests/home_assistant/test_native_actions.py
      - name: Generate HA reports
        run: |
          set -o pipefail
          python -m coverage report --rcfile=.coveragerc-ha | tee -a "$GITHUB_STEP_SUMMARY"
          python -m coverage json --rcfile=.coveragerc-ha -o coverage-ha.json
          python -m coverage xml --rcfile=.coveragerc-ha -o coverage-ha.xml
      - name: Enforce HA line coverage (minimum 90%)
        run: |
          set -o pipefail
          python tools/quality_gate.py coverage coverage-ha.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: ha-coverage-report
          path: |
            coverage-ha.json
            coverage-ha.xml
          if-no-files-found: error
          retention-days: 14

  windows-coverage-data:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows_agent
    env:
      COVERAGE_FILE: coverage-windows-data.${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: |
            requirements-quality.txt
            windows_agent/requirements-dev.txt
            windows_agent/requirements.txt
      - run: uv pip install --system -r requirements-dev.txt -r ../requirements-quality.txt
      - run: python -m coverage run --rcfile=../.coveragerc-windows -m pytest -q --durations=12
      - run: python -m coverage report --rcfile=../.coveragerc-windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-coverage-data-${{ matrix.os }}
          path: windows_agent/coverage-windows-data.${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14

  windows-coverage:
    needs: windows-coverage-data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows_agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r ../requirements-quality.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: windows-coverage-data-*
          path: windows_agent
          merge-multiple: true
      - name: Combine Windows and Linux executions
        run: |
          set -euo pipefail
          test -s coverage-windows-data.ubuntu-latest
          test -s coverage-windows-data.windows-latest
          python -m coverage combine --rcfile=../.coveragerc-windows
          python -m coverage report --rcfile=../.coveragerc-windows | tee -a "$GITHUB_STEP_SUMMARY"
          python -m coverage json --rcfile=../.coveragerc-windows -o coverage-windows.json
          python -m coverage xml --rcfile=../.coveragerc-windows -o coverage-windows.xml
        shell: bash
      - name: Enforce Windows line coverage (minimum 90%)
        run: |
          set -o pipefail
          python ../tools/quality_gate.py coverage coverage-windows.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: windows-coverage-report
          path: |
            windows_agent/coverage-windows.json
            windows_agent/coverage-windows.xml
          if-no-files-found: error
          retention-days: 14
