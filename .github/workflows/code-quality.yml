name: Python code quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-quality.txt pytest
      - run: python -m pytest -q tests/test_quality_gate.py
      - name: Enforce function and method complexity (maximum C)
        run: |
          set -o pipefail
          python tools/quality_gate.py complexity | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: complexity-report
          path: complexity-report.json
          if-no-files-found: error
          retention-days: 14

  ha-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: pip install -r requirements-quality.txt pytest-homeassistant-custom-component==0.13.373
      - name: Measure all existing HA test suites
        run: |
          python -m coverage run --rcfile=.coveragerc-ha -m pytest -q -o asyncio_mode=auto tests/home_assistant/test_rules.py tests/home_assistant/test_liveness.py tests/home_assistant/test_update_protocol.py tests/home_assistant/test_coverage.py tests/home_assistant/test_candidate_protocol.py tests/home_assistant/test_app_registry.py tests/home_assistant/test_foreground_accounting.py
          python -m coverage run --append --rcfile=.coveragerc-ha -m pytest -q -o asyncio_mode=auto tests/home_assistant/test_ha_runtime.py tests/home_assistant/test_options_flow_tracked_apps.py tests/home_assistant/test_recorder_runtime.py tests/home_assistant/test_migration_preflight.py tests/home_assistant/test_migration_journal.py tests/home_assistant/test_automation_owned_cleanup.py
          python -m coverage run --append --rcfile=.coveragerc-ha -m pytest -q -o asyncio_mode=auto tests/home_assistant/test_direct_mqtt.py
      - name: Generate HA reports
        run: |
          set -o pipefail
          python -m coverage report --rcfile=.coveragerc-ha | tee -a "$GITHUB_STEP_SUMMARY"
          python -m coverage json --rcfile=.coveragerc-ha -o coverage-ha.json
          python -m coverage xml --rcfile=.coveragerc-ha -o coverage-ha.xml
      - name: Enforce HA line coverage (minimum 90%)
        run: |
          set -o pipefail
          python tools/quality_gate.py coverage coverage-ha.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: ha-coverage-report
          path: |
            coverage-ha.json
            coverage-ha.xml
          if-no-files-found: error
          retention-days: 14

  windows-coverage-data:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows_agent
    env:
      COVERAGE_FILE: coverage-windows-data.${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt -r ../requirements-quality.txt
      - run: python -m coverage run --rcfile=../.coveragerc-windows -m pytest -q
      - run: python -m coverage report --rcfile=../.coveragerc-windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-coverage-data-${{ matrix.os }}
          path: windows_agent/coverage-windows-data.${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14

  windows-coverage:
    needs: windows-coverage-data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows_agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r ../requirements-quality.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: windows-coverage-data-*
          path: windows_agent
          merge-multiple: true
      - name: Combine Windows and Linux executions
        run: |
          set -euo pipefail
          test -s coverage-windows-data.ubuntu-latest
          test -s coverage-windows-data.windows-latest
          python -m coverage combine --rcfile=../.coveragerc-windows
          python -m coverage report --rcfile=../.coveragerc-windows | tee -a "$GITHUB_STEP_SUMMARY"
          python -m coverage json --rcfile=../.coveragerc-windows -o coverage-windows.json
          python -m coverage xml --rcfile=../.coveragerc-windows -o coverage-windows.xml
        shell: bash
      - name: Enforce Windows line coverage (minimum 90%)
        run: |
          set -o pipefail
          python ../tools/quality_gate.py coverage coverage-windows.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: windows-coverage-report
          path: |
            windows_agent/coverage-windows.json
            windows_agent/coverage-windows.xml
          if-no-files-found: error
          retention-days: 14
