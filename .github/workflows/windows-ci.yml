name: Windows agent CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  # PR revisions supersede one another; main, schedules and manual runs never do.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows_agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./check_powershell.ps1 .
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: |
            requirements-quality.txt
            windows_agent/requirements-dev.txt
            windows_agent/requirements.txt
      - run: uv pip install --system -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q gaming_control service_entry.py
