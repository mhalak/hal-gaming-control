name: HA integration CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  # PR revisions supersede one another; main, schedules and manual runs never do.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q tests/home_assistant/test_rules.py tests/home_assistant/test_liveness.py tests/home_assistant/test_update_protocol.py tests/home_assistant/test_foreground_accounting.py tests/home_assistant/test_raw_foreground.py
      - run: python -m compileall -q custom_components
      - run: python -m json.tool custom_components/hal_gaming_control/manifest.json
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: |
            requirements-quality.txt
            windows_agent/requirements-dev.txt
            windows_agent/requirements.txt
      - run: uv pip install --system pytest-homeassistant-custom-component==0.13.373
      - run: python -m pytest -q -o asyncio_mode=auto tests/home_assistant/test_domain_clean_cut.py tests/home_assistant/test_ha_runtime.py tests/home_assistant/test_options_flow_tracked_apps.py tests/home_assistant/test_candidate_protocol.py tests/home_assistant/test_app_registry.py tests/home_assistant/test_app_editor.py tests/home_assistant/test_recorder_runtime.py tests/home_assistant/test_automation_owned_cleanup.py tests/home_assistant/test_foreground_store.py tests/home_assistant/test_legacy_activity_cleanup.py tests/home_assistant/test_foreground_e2e.py tests/home_assistant/test_foreground_coordinator.py tests/home_assistant/test_foreground_sensor.py tests/home_assistant/test_budget_overview.py tests/home_assistant/test_parent_bonus_journal.py tests/home_assistant/test_parent_bonus_undo.py tests/home_assistant/test_restriction_sensor.py tests/home_assistant/test_schedule_controls.py tests/home_assistant/test_weekend_schedule.py tests/home_assistant/test_fresh_start.py tests/home_assistant/test_foreground_source.py tests/home_assistant/test_ota_transport.py tests/home_assistant/test_ota_release.py tests/home_assistant/test_ota_pipeline.py tests/home_assistant/test_ota_signed_install.py tests/home_assistant/test_screen_idle.py tests/home_assistant/test_screen_idle_ha.py tests/home_assistant/test_unified_telemetry.py tests/home_assistant/test_unified_telemetry_ha.py tests/home_assistant/test_native_actions.py
