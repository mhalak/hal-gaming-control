# Windows PC name and stable device ID are resolved automatically.
# Use a different MQTT username/password for each PC.
mqtt:
  # MQTT 5 broker required; commands are never retained.
  host: REPLACE_WITH_BROKER_IP
  port: 1883
  username: REPLACE_WITH_USERNAME
  password: REPLACE_WITH_PASSWORD
  tls: false
  discovery_prefix: homeassistant

# Transitional: these rules are still required for the legacy manual
# Terminate game action. See issue #155 for HA-authoritative replacement.
games:
  - name: Minecraft Java
    process: javaw.exe
    command_line_arg: net.minecraft.client.main.Main
  - name: Minecraft Bedrock
    process: Minecraft.Windows.exe
  - name: Roblox
    process: RobloxPlayerBeta.exe

# Remote updater disabled until trusted signing and provisioning exist.
update:
  enabled: false
