# HAL Gaming Control — minimal Windows companion configuration.
# Computer name is read from Windows; per-PC device_id is stored in ProgramData.
# Use a distinct broker account for each computer, with device-scoped ACLs.
mqtt:
  host: REPLACE_WITH_BROKER_IP
  username: REPLACE_WITH_USERNAME
  password: REPLACE_WITH_PASSWORD
  # Optional: port defaults to 1883; TLS defaults to false.
  # port: 8883
  # tls: true
  # ca_certs: C:\\path\\to\\trusted-ca.pem

# App detection and display names are configured in Home Assistant.
# Without legacy 'games', Lock PC still works, but Terminate game is
# deliberately unavailable until a safe HA-authoritative protocol ships.
# Existing upgraded PCs may keep their legacy 'games' rules for manual kill.
# Remote updater remains disabled by default.

# Breaking clean cut #176: unified v3 telemetry is mandatory, not a toggle.
# One non-retained state/telemetry JSON packet replaces the old scalar and v2
# foreground/display monitoring topics. Match HA 0.12.0+ v3 source selection
# before installing. Command/OTA/terminate-offer channels stay independent.
